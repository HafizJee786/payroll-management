<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayRoll Pro — Corporate Payroll Management</title>
 
  <!-- ─── Tailwind CSS ─── -->
  <script src="https://cdn.tailwindcss.com"></script>
 
  <!-- ─── Google Fonts ─── -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap"
    rel="stylesheet"
  />
 
  <!-- ─── Chart.js ─── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
 
  <!-- ─── Babel (JSX transpiler) ─── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
 
  <!-- ─── Custom Styles ─── -->
  <link rel="stylesheet" href="style.css" />
</head>
 
<body class="bg-slate-900 font-body antialiased">
 
  <!-- React mounts here -->
  <div id="root"></div>
 
  <!-- ─── React & ReactDOM ─── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
 
  <!-- ═══════════════════════════════════════
       JS FILES  (load order matters!)
       1. data      → raw data only
       2. components → reusable UI pieces
       3. pages     → full page views
       4. App       → root + router
  ═══════════════════════════════════════ -->
 
  <!-- Data -->
  <script type="text/babel" src="mockdata.js"></script>
 
  <!-- Components -->
  <script type="text/babel" src="StatCard.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
 
  <!-- Pages -->
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="Employees.jsx"></script>
  <script type="text/babel" src="Salary.jsx"></script>
  <script type="text/babel" src="Taxes.jsx"></script>
  <script type="text/babel" src="Payslip.jsx"></script>
 
  <!-- Root App -->
  <script type="text/babel" src="App.jsx"></script>
 
</body>
</html>
